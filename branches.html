<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Təməl viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Zoom meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4/dist/css/splide.min.css" />
    <link rel="stylesheet" href="public/assets/css/style.css">
    <title>TamStore Plus</title>
</head>

<body>

    <!-- header start -->
    <div id="header-placeholder"></div>
    <script>
        (function () {
            const url = "header.html";
            const cacheKey = `partial:${url}`;
            const node = document.getElementById("header-placeholder");
            if (!node) return;

            try {
                const cached = localStorage.getItem(cacheKey);
                if (cached) node.innerHTML = cached;
            } catch (error) {
                console.warn("Header preload cache error:", error);
            }

            if (window.location.protocol === "file:") return;

            fetch(url)
                .then((response) => {
                    if (!response.ok) throw new Error(`Header yüklənmədi: ${response.status}`);
                    return response.text();
                })
                .then((html) => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");
                    const nextHtml = doc.body.innerHTML;
                    if (node.innerHTML !== nextHtml) node.innerHTML = nextHtml;
                    try {
                        localStorage.setItem(cacheKey, nextHtml);
                    } catch (error) {
                        console.warn("Header cache write error:", error);
                    }
                })
                .catch((error) => {
                    console.warn("Header preload fetch error:", error);
                });
        })();
    </script>
    <!-- header end -->

    <div class="page-container branches-page">

        <!-- hero start -->
        <div class="page-hero branches-hero">

            <img src="assets/images/hompage-hero.jpg" alt="">

            <div class="hero-content">
                <span class="hero-title">fİLİALLARIMIZ</span>
                <span class="breadcrumb">Əsas Səhifə &nbsp; &nbsp;/ &nbsp; &nbsp; Filiallarımız</span>
            </div>

            <div class="overlay"></div>

        </div>
        <!-- hero end -->

    </div>

    <!-- footer start -->
    <div id="footer-placeholder"></div>

    <script>
        (function () {
            const url = "footer.html";
            const cacheKey = `partial:${url}`;
            const node = document.getElementById("footer-placeholder");
            if (!node) return;

            try {
                const cached = localStorage.getItem(cacheKey);
                if (cached) node.innerHTML = cached;
            } catch (error) {
                console.warn("Footer preload cache error:", error);
            }

            if (window.location.protocol === "file:") return;

            fetch(url)
                .then((response) => {
                    if (!response.ok) throw new Error(`Footer yüklənmədi: ${response.status}`);
                    return response.text();
                })
                .then((html) => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");
                    const nextHtml = doc.body.innerHTML;
                    if (node.innerHTML !== nextHtml) node.innerHTML = nextHtml;
                    try {
                        localStorage.setItem(cacheKey, nextHtml);
                    } catch (error) {
                        console.warn("Footer cache write error:", error);
                    }
                })
                .catch((error) => {
                    console.warn("Footer preload fetch error:", error);
                });
        })();
    </script>
    <!-- footer end -->

    <!-- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4/dist/js/splide.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-auto-scroll@0.5.3/dist/js/splide-extension-auto-scroll.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-element-bundle.min.js"></script>
    <script src="assets/js/productsSwiper.js"></script>
    <script src="assets/js/splide.js"></script>

</body>

</html>
